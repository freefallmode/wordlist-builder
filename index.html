<!doctype html>
<html lang="en" data-v="21">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wordlist Builder</title>
<!-- Bump v here and VERSION in app.js on every change, so browsers fetch the new files. -->
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">Wordlist Builder <span id="savestate" class="muted"></span></div>
    <input id="find" type="search" placeholder="Find a word or theme" autocomplete="off">
    <div id="found"></div>
    <div class="row tight">
      <button id="expall" title="Expand all">Expand</button>
      <button id="colall" title="Collapse all">Collapse</button>
      <button id="lock"></button>
      <button id="addroot" title="Add a top-level group (while dragging, drop a theme here to make it top level)">＋</button>
    </div>
    <div id="tree"></div>
    <div class="row foot">
      <button id="dataBtn">Import / export…</button>
      <button id="setBtn">Settings…</button>
    </div>
  </aside>
  <main>
    <div class="row top">
      <nav id="crumbs"></nav>
      <span class="grow"></span>
      <button id="spell" title="Switch between American and British spelling"></button>
      <button id="setBtn2">⚙ Settings</button>
    </div>
    <h2 id="ttl"></h2>
    <div id="meta" class="muted"></div>
    <div id="overlap" class="muted"></div>
    <div id="msg"></div>
    <div class="row">
      <button class="p" id="genWords">Generate words…</button>
      <button class="p" id="genSubs">Generate sub-themes…</button>
      <button id="addWords">Add words…</button>
      <button id="themeSet">Theme settings…</button>
      <button id="checkBtn" title="Ask Claude which other themes each word fits">Check themes…</button>
      <button id="reviewBtn" hidden></button>
    </div>
    <div class="row">
      <input id="q" type="search" placeholder="Filter this list" autocomplete="off">
      <select id="show">
        <option value="all">All words</option>
        <option value="on">Enabled</option>
        <option value="off">Disabled</option>
        <option value="sug">With suggestions to review</option>
        <option value="clash">With clashes</option>
        <option value="unchecked">Not yet checked</option>
      </select>
      <label><input type="checkbox" id="sub" checked> include sub-themes</label>
      <span id="cnt" class="muted"></span>
    </div>
    <div class="row selbar">
      <span id="selinfo" class="muted"></span>
      <button id="selEna">Enable</button>
      <button id="selDis">Disable</button>
      <button id="selUnlink" title="Unlink the selected words from this theme. Words left with no theme are deleted.">Remove from this theme</button>
      <button id="selDel" class="danger" title="Delete the selected words from every theme">Delete</button>
      <button id="selNone" class="link">Clear selection</button>
      <span class="grow"></span>
      <button id="undo" hidden></button>
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th><input type="checkbox" id="selall" title="Select every word in this list"></th>
          <th title="Enabled words can be used in levels">On</th>
          <th data-sort="t">Word</th>
          <th data-sort="len" title="Letters, ignoring spaces and hyphens">Len</th>
          <th data-sort="z" title="Zipf frequency: 7 = 'the', 5 = common, 3 = uncommon, under 2 = rare">Freq</th>
          <th data-sort="d" title="1 easy to 5 hard. 'auto' comes from frequency">Diff</th>
          <th data-sort="th">Themes</th>
          <th>Note</th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="more"></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<script src="app.js?v=21"></script>
</body>
</html>
